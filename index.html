<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music History Quiz Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{--bg:#FFF9EC;--fg:#0E273C;--card:#FFFDF6;--bd:#e3dccb;--ac:#0E273C;--gold:#D4A94E;--hd:#0E273C;--hdt:#FFF9EC;--ok:#dcebd8;--okb:#2f7d3a;--no:#f3dcd6;--nob:#a63a2e;--mut:#7C7C7C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/*@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d4529;--fg:#FFF9EC;--card:#143350;--bd:#2c4a66;--ac:#FFF9EC;--gold:#D4A94E;--hd:#143350;--hdt:#FFF9EC;--ok:#1f3a2c;--okb:#6cc47a;--no:#4a2a2e;--nob:#e07a7a;--mut:#a3a3a3}}*/
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:19px/1.5 "EB Garamond",Garamond,Georgia,serif}
main{max-width:640px;margin:0 auto;padding:18px}
h1{font-size:1.7rem;font-weight:600;background:var(--hd);color:var(--hdt);padding:20px 22px;border-radius:12px;border-bottom:4px solid var(--gold);margin:6px 0 16px}
button{font:inherit;cursor:pointer;color:var(--fg)}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--gold);border-radius:10px;padding:16px;margin:12px 0;font-size:1.1rem;box-shadow:0 1px 3px rgba(14,39,60,.08)}
.q{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:13px 16px;margin:9px 0;box-shadow:0 1px 2px rgba(14,39,60,.08);transition:transform .1s,border-color .1s}
.q:hover{border-color:var(--gold);transform:translateY(-1px)}
.sel{border-color:var(--gold);border-width:2px;background:var(--bg)}
.ok{background:var(--ok);border-color:var(--okb)}
.no{background:var(--no);border-color:var(--nob)}
.go{background:var(--gold);color:#0E273C;font-weight:600;border:0;border-radius:8px;padding:11px 22px;margin:10px 6px 0 0}
.mut{color:var(--mut);font-size:.9rem}
.bar{height:6px;background:var(--bd);border-radius:3px}.bar i{display:block;height:6px;background:var(--gold);border-radius:3px}
</style></head><body><main id="app"></main>
<script>
// Quiz data: [id, title, [[question, [choices], correctIndex or [indices]], ...]]
const D=[
["C1","C1 · Ancient music",[
["Our knowledge of ancient (pre-literate) music is based on what?",["depictions in visual art","surviving instruments","writings on music","all of the above"],3],
["Which of the following was not one of the most important instruments in ancient Greek music?",["aulos","lyre","kithara","ukelele"],3],
["Aristoxenus, Cleonides, and Aristides Quintilianus were all what?",["Olympic athletes","musical performers","music theorists","all of the above"],2],
["Who wrote about music in terms of ethos and the Doctrine of Imitation in his book Poetics?",["Socrates","Plato","Aristotle","Ptolemy"],2],
["Seven-note scales, going back to the Babylonians, with parallels in ancient Greek music and music today, are called what (the appropriate adjective)?",["pentatonic","chromatic","whole-tone","diatonic"],3],
["In ancient Mesopotamian music, hymns were songs to what?",["a god or gods","lovers","temples","stars"],0],
["Which of the following is not true of the Epitaph of Seikilos?",["It is the oldest piece of music associated with the Western tradition that survives in its entirety","It is monophonic, but may not always have been performed that way","It was written specifically for the lyre","It has text attached to it"],2],
["Which of the following was one of the two specifically Greek contributions to ancient music?",["the interlocking of melody with the rhythm of words","instead of notation, there was reliance on oral tradition and knowledge of conventions/formulas","a scientifically based acoustical theory","a view of music as a system linked to nature and human thought and behavior"],2]]],
["C2","C2 · Chant & modes",[
["Which of the following is not true about the modes?",["Each one has a final, standard range, and reciting tone","Odd-numbered ones are called authentic","Even-numbered ones are called plagal","Paired modes have different ranges and reciting tones, but share a final","The only pitch names for finals are D, E, F, and G","Each mode features absolute pitch specificity"],5],
["Each of the eight church modes is essentially characterized by what?",["its arrangement/sequence of whole and half steps in relation to the final","its unique rhythmic properties","its number of pitches","none of the above"],0],
["Who loved music but was extremely suspicious of its power to give pleasure?",["St. Basil","St. Augustine","Egeria","Charlemagne"],1],
["Who divided music into three types: musica mundana, musica humana, and musica instrumentalis?",["St. Augustine","Martianus Capella","Boethius","Guido of Arezzo"],2],
["In the four-line staff suggested by Guido of Arezzo, what interval separated each line from the one above or below it?",["second","third","fourth","fifth"],1],
["A legend arose claiming that chant was dictated to Pope Gregory I (Gregory the Great) by whom?",["St. Peter","St. Paul","St. Basil","the Holy Spirit"],3],
["A rite consists of what?",["church calendar","liturgy","chant repertoire","all of the above"],3],
["Christianity’s Jewish roots resulted in Christians extensively chanting texts from what book?",["Exodus","Psalms","Proverbs","Isaiah"],1]]],
["C3-1","C3-1 · Chant & the Mass",[
["What chant features a jubilus?",["Gradual","Alleluia","Communion","Offertory"],1],
["Which of the following statements is not true about the Mass?",["It is the most important service in the Roman Church","The texts that change from day to day are called the Mass Proper","The texts that remain the same from day to day are called the Mass Ordinary","The Mass began with, and evolved from, commemoration of the Resurrection"],3],
["What is/are the daily series of eight services in monasteries and convents called?",["canticles","Office","antiphonal psalmody","tropes"],1],
["Which of the following chants is the simplest?",["recitation formula","Psalm tone","antiphon","hymn"],0],
["Which of the following belongs to the Ordinary of the Mass?",["Introit","Kyrie","Gospel","Offertory"],1],
["The words syllabic, neumatic, and melismatic pertain to what aspect of chant?",["rhythm","mode use","text setting","texture"],2],
["Which of the following belongs to the Proper of the Mass?",["Gradual","Credo","Sanctus","Agnus Dei"],0]]],
["C3-2","C3-2 · Sequences & Hildegard",[
["Who was the most famous early Medieval writer of sequence texts?",["Notker Balbulus","Bernart de Ventadorn","Eleanor of Aquitaine","Comtessa de Dia"],0],
["What is the standard musical form of the sequence?",["ABCA","ABA’","AA BB CC…","A BB CC…N"],3],
["What is Hildegard’s Ordo virtutum?",["a unified setting of the Mass Ordinary","a sacred drama","texts intended to be set to reciting tones for use in the Office","texts and music on the subject of courtly love"],1],
["The Dies irae is an example of what genre?",["antiphon","hymn","sequence","liturgical drama"],2],
["Which of the following is true of Hildegard of Bingen?",["She founded her own convent","She was famous for her prophecies and correspondence with kings, popes, and bishops","A greater number of surviving chants are attributed to her than to any other Medieval composer","all of the above"],3],
["An expansion of an existing chant is called what?",["interpolation","trope","sequence","commentary"],1]]],
["C4-1","C4-1 · Secular music background",[
["Whose death marked the beginning of the separation of linguistic/cultural groups within the area ruled by Charlemagne?",["Charlemagne himself","Louis the Pious","Richard I (the Lionheart)","Eleanor of Aquitaine"],1],
["Chapter 4 covers “secular” music from roughly when to roughly when?",["500-800","800-1300","700-1000","1300-1400"],1],
["By 1300, which “successor to the Roman Empire” had emerged as the strongest economically?",["They were more or less equally strong","Byzantine Empire","Arab world","western Europe"],3],
["What did versus and conductus have in common?",["They were settings of Latin texts","Their melodies were newly composed, not based on chant","Their cultivation was primarily in Aquitaine","all of the above"],3],
["What is true about the chanson de geste?",["It was an epic poem","It was cultivated in northern France","It was in French","all of the above"],3],
["What were bards, jongleurs, and minstrels?",["musical monks and nuns","professional traveling, non-church musicians","acrobats","comedians"],1]]],
["C4-2","C4-2 · Troubadours & medieval song",[
["Minnelieder are love songs (of a sort!) from what general area of Europe?",["Spain","Germany","France","England"],1],
["The cantigas from Spain/Portugal celebrate whom?",["St. Peter","Virgin Mary","Jesus Christ","King Alfonso el Sabio (the Wise)"],1],
["The troubadours and trouvères flourished in what general area of Europe?",["Spain","Germany","France","England"],2],
["Troubadours and trouvères are collectively known for their what?",["poetry only","music only","both poetry and music","performance only"],2],
["Which is the best way to describe the form of the majority of medieval songs?",["ABA","ABACA","AAB","ABC"],2],
["Creating new words for pre-existent melody is called what?",["mutation","contrafactum","fine amour (or fin’ amors)","chanson de geste"],1]]],
["C5-1","C5-1 · Early polyphony",[
["What is the term that has long been used for the earliest types of polyphony?",["discant","organum","duplum","tenor"],1],
["A sustained note against which a melody is played or sung is called what?",["drone","pedal","mode","duplum"],0],
["Select all four principal concepts that have defined Western music since the beginning of polyphony. (Select all that apply.)",["measured rhythm","instrumental families","counterpoint/polyphony","centrality of notation","improvisation","harmonic regulation of simultaneous sounds","composition, distinct from performance","independent instrumental music"],[2,3,5,6]]]],
["C5-2","C5-2 · Notre Dame",[
["The rhythmic modes were developed in association with the musicians at what cathedral?",["Winchester","Durham","Notre Dame","Amiens"],2],
["How many rhythmic modes are there?",["3","4","5","6"],3],
["The note groups indicating different patterns of longs and breves are called what?",["ligatures","substitute clausulae","organum triplum","organum quadruplum"],0],
["When did the rhythmic modes and the even more ornate styles of polyphony in this cathedral environment flourish?",["ninth and tenth centuries","tenth and eleventh centuries","eleventh and twelfth centuries","twelfth and thirteenth centuries"],3],
["Who is credited with making the Magnus liber organi?",["Leoninus","Perotinus","Anonymous IV","Adam de la Halle"],0],
["What is the term used for the newly composed upper voice in Leoninus’s two-voice organum?",["tenor","duplum","soprano","descant"],1]]],
["C5-3","C5-3 · Perotinus, conductus & motet",[
["The words duplum, triplum, and quadruplum refer to what?",["rhythmic modes 2, 3, and 4","second, third, and fourth voices above a chant in ascending order","medieval string instruments in a small ensemble from highest pitch range to lowest","prayers following the first, second, and third Psalms read in any service from the Divine Office"],1],
["Who is credited with having written polyphony for two or three additional voices over a chant tenor?",["Leoninus","Perotinus","Anonymous IV","all of the above"],1],
["The newly composed polyphony referred to in the previous question features what?",["short, repeated phrases","voice exchange","rhythmic modes","all of the above"],3],
["Which of the following characterizes polyphonic conductus?",["newly composed tenor","all voices singing in the same rhythm, or something close to it (homophony)","syllabic, or mostly syllabic, text setting except for possible opening and closing caudae","strophic Latin poems on a sacred or serious topic"],2],
["What is a clausula in Notre Dame polyphony?",["a self-contained section of an organum","a long melisma","a short melisma","any organum for two voices"],0],
["The thirteenth-century motet (a new genre!) grew out of what?",["polyphonic conductus","discant clausulae","troubadour songs","Gregorian hymns"],1],
["Sumer is icumen in was created where?",["England","France","Spain","Italy"],0]]],
["C6-1","C6-1 · Ars nova",[
["Which of the following occurred during the fourteenth century?",["the Black Death","rivaling popes","the beginning of separation between church and state","all of the above"],3],
["Ars nova means what, in translation?",["revolutionary art","novel art","niche art","none of the above"],3],
["What is a minim?",["the smallest rest value in the new notation system","the smallest note value in the new notation system","a tiny keyboard instrument new to fourteenth-century France","a new genre of song featuring a single short stanza of text on the subject of nature"],1],
["Tenors featuring talea and color are associated with what new compositional device?",["hocket","isorhythm","mensuration signs","formes fixes"],1],
["The ballade, rondeau, and virelai are all what?",["formes fixes","new types of motet","instrumental dance genres","none of the above"],0],
["Ars subtilior applies to music from when, roughly?",["early fourteenth century","mid fourteenth century","late fourteenth century","the whole fourteenth century"],2],
["The Messe de Nostre Dame is by whom?",["Philippe de Vitry","Jacobus de Ispania","Guillaume de Machaut","Philipoctus de Caserta"],2]]],
["C6-2","C6-2 · Trecento",[
["What polyphonic vocal genre from the Trecento is a song for 2-3 voices involving two or more stanzas of poetry set to the same music, followed by a ritornello (final poetic couplet) in a contrasting meter?",["caccia","ballata","madrigal","istampita"],2],
["What polyphonic vocal genre from the Trecento features two voices in strict canon at the unison?",["caccia","ballata","madrigal","istampita"],0],
["What polyphonic vocal genre from the Trecento has the form AbbaA (virtually the same as the French virelai)?",["caccia","ballata","madrigal","istampita"],1],
["Who was the leading composer of ballata?",["Gherardello da Firenze","Jacopo da Bologna","Francesco Landini","Giovanni Boccaccio"],2],
["What was musica ficta?",["departures from notated rhythm","chromatic alteration","simultaneous superimposition of two or more modes","vocal and instrumental combinations"],1],
["In Trecento music, the adjectives double leading-tone, Phrygian, and Landini all refer to what?",["genres","modes","scales","cadences"],3]]]
];

const app=document.getElementById('app');
let S={},shuffle=true;
const L='abcdefgh';
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const tot=D.reduce((n,d)=>n+d[2].length,0);
const K='mhWeak';
function ld(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}}
function sv(w){try{localStorage.setItem(K,JSON.stringify(w))}catch(e){}}
function wk(){const n=Object.keys(ld()).length;return n?`<button class="q" onclick="weak()"><b>Practice my weak spots</b><br><span class="mut">${n} question${n>1?'s':''} to review · <span onclick="event.stopPropagation();clr()" style="text-decoration:underline">clear list</span></span></button>`:''}
function weak(){const w=ld();let qs=[];D.forEach(d=>d[2].forEach(q=>{if(w[q[0]])qs.push(q)}));S.id='weak';begin(qs)}
function clr(){if(confirm('Clear your weak-spots list?')){sv({});home()}}

function home(){
  app.innerHTML=`<h1>Music History Quiz Practice</h1>
  <p class="mut">Pick a quiz to practice. You get instant feedback after each question.</p>
  <label class="mut"><input type="checkbox" id="shf" ${shuffle?'checked':''}> Shuffle question order</label>
  ${wk()}<button class="q" onclick="go('all')"><b>All quizzes mixed</b><br><span class="mut">${tot} questions</span></button>`+
  D.map(d=>`<button class="q" onclick="go('${d[0]}')"><b>${d[1]}</b><br><span class="mut">${d[2].length} question${d[2].length>1?'s':''}</span></button>`).join('');
  document.getElementById('shf').onchange=e=>shuffle=e.target.checked;
}
function go(id){if(id=='weak')return weak();
  let qs=[];D.forEach(d=>{if(id=='all'||d[0]==id)qs.push(...d[2])});
  S.id=id;begin(qs);
}
function begin(qs){
  S.qs=shuffle?sh(qs):qs;S.i=0;S.score=0;S.missed=[];S.sel=[];S.done=false;show();
}
function show(){
  const q=S.qs[S.i],multi=Array.isArray(q[2]);
  S.sel=[];S.done=false;
  app.innerHTML=`<button class="mut" style="background:none;border:0;padding:0" onclick="home()">← All quizzes</button>
  <div class="bar" style="margin:8px 0"><i style="width:${S.i/S.qs.length*100}%"></i></div>
  <p class="mut">Question ${S.i+1} of ${S.qs.length} · Score ${S.score}</p>
  <div class="card"><b>${q[0]}</b>${multi?'<br><span class="mut">Select all that apply</span>':''}</div>
  <div id="opts">${q[1].map((o,k)=>`<button class="q" id="o${k}" onclick="pick(${k})">${L[k]}. ${o}</button>`).join('')}</div>
  <div id="fb"></div>
  ${multi?'<button class="go" id="chk" onclick="check()">Check answer</button>':''}`;
}
function pick(k){
  if(S.done)return;
  const q=S.qs[S.i];
  if(Array.isArray(q[2])){
    const p=S.sel.indexOf(k);p<0?S.sel.push(k):S.sel.splice(p,1);
    document.getElementById('o'+k).classList.toggle('sel');
  }else{S.sel=[k];check()}
}
function check(){
  if(S.done||!S.sel.length)return;S.done=true;
  const q=S.qs[S.i],ans=[].concat(q[2]);
  const right=S.sel.length==ans.length&&S.sel.every(x=>ans.includes(x));
  q[1].forEach((_,k)=>{const e=document.getElementById('o'+k);e.classList.remove('sel');
    if(ans.includes(k))e.classList.add('ok');else if(S.sel.includes(k))e.classList.add('no')});
  const w=ld();if(right){S.score++;delete w[q[0]]}else{S.missed.push(q);w[q[0]]=(w[q[0]]||0)+1}sv(w);
  const last=S.i==S.qs.length-1;
  document.getElementById('fb').innerHTML=`<p><b>${right?'Correct!':'Not quite.'}</b>${right?'':' The right answer is highlighted in green.'}</p><button class="go" onclick="next()">${last?'See results':'Next →'}</button>`;
  const c=document.getElementById('chk');if(c)c.remove();
}
function next(){S.i++;S.i<S.qs.length?show():results()}
function results(){
  const n=S.qs.length,pct=Math.round(S.score/n*100);
  app.innerHTML=`<h1>${S.score} / ${n} (${pct}%)</h1>
  ${S.missed.length?`<h3>Missed questions</h3>`+S.missed.map(q=>{const a=[].concat(q[2]).map(k=>q[1][k]).join('; ');return `<div class="card">${q[0]}<br><span style="color:var(--okb)">✓ ${a}</span></div>`}).join(''):'<p>Perfect score!</p>'}
  ${S.missed.length?'<button class="go" onclick="begin(S.missed.slice())">Retry missed questions</button> ':''}
  <button class="go" onclick="go(S.id)">Retake quiz</button>
  <button class="go" onclick="home()">All quizzes</button>`;
}
home();
</script></body></html>
